name: AURA10 Android Native Core
on:
  push:
    branches: [aura10-android-corrigido-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android source
        run: |
          mkdir -p aura10-project
          unzip -q aura10-source.zip -d aura10-project
          test $(wc -c < aura10-project/app/src/main/assets/aura.html) -gt 1800000
      - name: Test Android mixer and JavaScript
        working-directory: aura10-project
        run: |
          bash tests/run-core-tests.sh
          node --check app/src/main/assets/native-ui.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/br/com/edgard/aura/SessionStore.java').read_text()
          assert '.put("tailConfidence",t.tailConfidence)' in s
          assert '.put("tailPhase",t.tailPhaseSeconds)' in s
          p=Path('app/src/main/java/br/com/edgard/aura/MainActivity.java').read_text()
          assert 'nativeFileSelect||list.isEmpty()' in p
          assert 'Math.min(2,list.size())' in p
          assert 'public String snapshot()' in p
          assert 'AURA_ANDROID' in p
          print("PASS native integration invariants")
          PY
      - name: Compile signed APK
        working-directory: aura10-project
        run: gradle --no-daemon assembleDebug
      - name: Verify signature, assets and package
        run: |
          set -eu
          APK=aura10-project/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F br.com.edgard.aura.completo10
          unzip -l "$APK" | grep -F assets/aura.html
          unzip -p "$APK" assets/native-ui.js | grep -Fq aura10-native-controller
          unzip -p "$APK" assets/aura.html | grep -Fq aura-portable-seed
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EDGARD-AURA10-ANDROID-APK
          path: aura10-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-smoke:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack AURA10 source
        run: |
          mkdir -p aura10-project
          unzip -q aura10-source.zip -d aura10-project
      - name: Compile Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          cd aura10-project
          gradle --no-daemon assembleDebug
      - name: Boot emulator, install app and test AudioTrack
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -eu
            mkdir -p aura10-smoke
            adb install -r aura10-project/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n br.com.edgard.aura.completo10/br.com.edgard.aura.MainActivity
            sleep 6
            adb shell dumpsys activity activities > aura10-smoke/activities.txt
            adb exec-out screencap -p > aura10-smoke/screenshot.png
            adb shell am startservice -n br.com.edgard.aura.completo10/br.com.edgard.aura.AudioService -a br.com.edgard.aura.SELFTEST
            sleep 6
            adb shell run-as br.com.edgard.aura.completo10 cat shared_prefs/aura.xml > aura10-smoke/aura-state.xml
            adb logcat -d -v time > aura10-smoke/logcat.txt
            grep -q 'Teste Android executado' aura10-smoke/aura-state.xml
            ! grep -q 'FATAL EXCEPTION' aura10-smoke/logcat.txt
      - name: Export Android smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AURA10-ANDROID-SMOKE-EVIDENCE
          path: aura10-smoke/
          if-no-files-found: ignore
