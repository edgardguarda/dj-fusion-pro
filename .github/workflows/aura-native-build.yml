name: AURA9 Android completo
on:
  push:
    branches:
      - aura9-original-completo-android
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract preserved original UI and Android source
        run: |
          mkdir -p aura9-project
          unzip -q aura9-source.zip -d aura9-project
          test -s aura9-project/app/src/main/assets/aura.html
          test -s aura9-project/app/src/main/assets/native-ui.js
          test -s aura9-project/app/src/main/java/br/com/edgard/aura/AudioService.java
          test $(wc -c < aura9-project/app/src/main/assets/aura.html) -gt 1800000
      - name: Test PCM core, tempo and overlap
        run: bash tests/run-core-tests.sh
        working-directory: aura9-project
      - name: Compile Android APK
        run: gradle --no-daemon assembleDebug
        working-directory: aura9-project
      - name: Verify signature, original UI and native mixer in APK
        run: |
          set -eu
          APK=aura9-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'br.com.edgard.aura.completo9'
          unzip -l "$APK" | grep -F 'assets/aura.html'
          unzip -l "$APK" | grep -F 'assets/native-ui.js'
          unzip -p "$APK" assets/aura.html | grep -Fq 'aura-portable-seed'
          unzip -p "$APK" assets/native-ui.js | grep -Fq 'aura9-native-controller'
          unzip -l "$APK" | grep -F 'classes.dex'
      - name: Upload signed installable Android app
        uses: actions/upload-artifact@v4
        with:
          name: EDGARD-AURA9-ANDROID-COMPLETO
          path: aura9-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error