name: EG MIX 11.5.3 - APK neural
on:
  push:
    branches: [eg-mix-11-5-3-session-reliability]
    paths: ['ci-source/**', '.github/workflows/eg-mix-11-4-8-neural.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract source package
        run: |
          cat ci-source/part-* > EG_MIX_11_4_8_GITHUB_COMPILACAO.zip
          echo '234267842e1dca473ec9edd3162f80da0af16dd4c3f94c6b2966490c38ab484c  EG_MIX_11_4_8_GITHUB_COMPILACAO.zip' | sha256sum -c -
          mkdir -p build-input
          unzip -q EG_MIX_11_4_8_GITHUB_COMPILACAO.zip -d build-input
          echo '319ea39f8a66076baa6775c40cdba9f18593880945aacea88ccc2705fc4232cf  ci-source/overlay-1149.zip' | sha256sum -c -
          unzip -oq ci-source/overlay-1149.zip -d build-input/EG_MIX_11_4_8
          echo '0fc1530de3c7bac4d150ced9898f1772e6ea2c7bc2c4a32d3ccd7b5f1aa03502  ci-source/overlay-1150.zip' | sha256sum -c -
          unzip -oq ci-source/overlay-1150.zip -d build-input/EG_MIX_11_4_8
          echo 'a4b732b7302b1b4b87e0c4c01ef3e33ef74409ec78ed7f5c75926bc8ac47edc4  ci-source/overlay-1151.zip' | sha256sum -c -
          unzip -oq ci-source/overlay-1151.zip -d build-input/EG_MIX_11_4_8
          echo 'ace6b9c7f7f0e00c1128f10f56c824219b12545e3c72aa39b857c28ffd2f4824  ci-source/overlay-1151b.zip' | sha256sum -c -
          unzip -oq ci-source/overlay-1151b.zip -d build-input/EG_MIX_11_4_8
          echo '6d0115d44a0db08888e1c0f1a3db4df554e57c7ee32a6d2a984ecb567afea1be  ci-source/overlay-1152.zip' | sha256sum -c -
          unzip -oq ci-source/overlay-1152.zip -d build-input/EG_MIX_11_4_8
          echo '4df508f0dc0e64a66159d354c10d874a9420502d40e8ed965dc61e336fe718d0  ci-source/overlay-1152b.zip' | sha256sum -c -
          unzip -oq ci-source/overlay-1152b.zip -d build-input/EG_MIX_11_4_8
          echo '59d2fe2a5e72b09aa0bcdd4849b28e97b2f7514f5deb5f9405ddeeec1b63df84  ci-source/overlay-1153.zip' | sha256sum -c -
          unzip -oq ci-source/overlay-1153.zip -d build-input/EG_MIX_11_4_8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK on hosted runner
        run: |
          echo "SDK: $ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Regression tests
        working-directory: build-input/EG_MIX_11_4_8
        run: |
          for suite in audio-safety session-integrity sampler-assets live-recovery smart-studio neural-pipeline native-stem stem-storage egmix security-reliability ux-fx; do bash tests/run-$suite-tests.sh; done
          python3 tests/check-all-assets.py
      - name: Export UI test harness
        uses: actions/upload-artifact@v4
        with:
          name: EG-MIX-11.5.3-ui-test-script
          path: build-input/EG_MIX_11_4_8/tests/android-ui-smoke.mjs
          if-no-files-found: error
      - name: Prepare verified neural model
        working-directory: build-input/EG_MIX_11_4_8
        run: python3 tools/prepare-model.py
      - name: Assemble signed debug APK
        working-directory: build-input/EG_MIX_11_4_8
        run: gradle --no-daemon assembleDebug
      - name: Validate APK signature and bundled model
        working-directory: build-input/EG_MIX_11_4_8
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          python3 tools/verify-bundled-apk.py "$APK"
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EG-MIX-11.5.3-neural-debug-apk
          path: |
            build-input/EG_MIX_11_4_8/app/build/outputs/apk/debug/app-debug.apk
            build-input/EG_MIX_11_4_8/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error

  android-live-smoke:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EG-MIX-11.5.3-neural-debug-apk
          path: live-apk
      - name: Verify exact APK and prepare test
        run: |
          (cd live-apk && sha256sum -c SHA256SUMS.txt)
          sudo chmod 666 /dev/kvm || true
          cat > live-test.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p live-evidence
          adb install -r live-apk/app-debug.apk
          adb logcat -c
          adb shell am start -W -n br.com.edgard.aura.completo11/br.com.edgard.aura.DebugPcmSmokeActivity
          for i in $(seq 1 20); do
            sleep 4
            adb exec-out run-as br.com.edgard.aura.completo11 cat shared_prefs/aura.xml > live-evidence/aura-state.xml || true
            if grep -q 'name="live_mixed_transitions"' live-evidence/aura-state.xml; then break; fi
          done
          adb logcat -d -v time > live-evidence/logcat.txt
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          a={x.attrib['name']:x.attrib.get('value',x.text) for x in ET.parse('live-evidence/aura-state.xml').getroot()}
          for k in ['smokePCM','live_fx_frames','live_sampler_frames','live_mixed_frames','live_mixed_transitions','live_hard_handoffs']: print(k,a.get(k))
          assert a['smokePCM']=='fixtures-created'
          assert int(a['live_fx_frames'])>4800
          assert int(a['live_sampler_frames'])>4800
          assert int(a['live_mixed_frames'])>48000
          assert int(a['live_mixed_transitions'])>=2
          assert int(a['live_hard_handoffs'])==0
          PY
          ! grep -q 'FATAL EXCEPTION' live-evidence/logcat.txt
          SH
      - name: Measure actual digital PCM rendering on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash live-test.sh
      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EG-MIX-11.5.3-live-android-evidence
          path: live-evidence/
          if-no-files-found: warn

  android-ui-smoke:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: EG-MIX-11.5.3-neural-debug-apk
          path: live-apk
      - uses: actions/download-artifact@v4
        with:
          name: EG-MIX-11.5.3-ui-test-script
          path: ui-test
      - name: Verify exact APK and prepare script
        run: |
          (cd live-apk && sha256sum -c SHA256SUMS.txt)
          sudo chmod 666 /dev/kvm || true
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' 'adb install -r live-apk/app-debug.apk' 'adb logcat -c' 'node ui-test/android-ui-smoke.mjs' '! grep -q "FATAL EXCEPTION" ui-evidence/logcat.txt' > run-ui.sh
      - name: Exercise real WebView controls and PCM audio on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash run-ui.sh
      - name: Upload UI and audio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EG-MIX-11.5.3-ui-android-evidence
          path: ui-evidence/
          if-no-files-found: warn
