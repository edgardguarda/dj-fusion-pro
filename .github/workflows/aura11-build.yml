name: EDGARD AURA11 11.2.4 Async handoff + reliable WAV + Android smoke
on:
  push:
    branches: [aura11-1-2-4-async-handoff-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK platform 35
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble AURA 11.2.1 from verified base and patches
        run: |
          set -euo pipefail
          echo '10d02c598c63be65c8ef473adcefc0a434ba418f5cc50eb1251cd8ab25dbe28f  aura11-source.zip' | sha256sum -c -
          base64 -d aura11-111/overlay.zip.base64 > /tmp/aura1111.zip
          echo 'fa130f7b1d3e217f648828148fb88e7cac356bf643ce8010a53b73dbb00f04ef  /tmp/aura1111.zip' | sha256sum -c -
          base64 -d aura11-112/patch.zip.base64 > /tmp/aura1112.zip
          echo '88daecaef4f807f354fa78f9cc8ab909e0b34cd1b74f43f1f5385d7706a765a4  /tmp/aura1112.zip' | sha256sum -c -
          base64 -d aura11-113/patch.zip.base64 > /tmp/aura1113.zip
          echo 'c316f3b0e0329c0bc757c9056943bbc9cd5d1043fe6516a927e4e3ff17d1f8a3  /tmp/aura1113.zip' | sha256sum -c -
          mkdir -p aura11-project
          unzip -q aura11-source.zip -d aura11-project
          unzip -q -o /tmp/aura1111.zip -d aura11-project
          unzip -q -o /tmp/aura1112.zip -d aura11-project
          unzip -q -o /tmp/aura1113.zip -d aura11-project
          base64 -d aura11-114/patch.zip.base64 > /tmp/aura1114.zip
          echo '81da749185306ac5d4700a3ac997470baf86c6007c47a60bc58d859faf07e543  /tmp/aura1114.zip' | sha256sum -c -
          unzip -q -o /tmp/aura1114.zip -d aura11-project
          base64 -d aura11-115/patch.zip.base64 > /tmp/aura1115.zip
          echo '9754caaeb73cbbd2c0c70f3b8decd808124898875dd666d3884c2703598d062d  /tmp/aura1115.zip' | sha256sum -c -
          unzip -q -o /tmp/aura1115.zip -d aura11-project
          base64 -d aura11-116/patch.gz.base64 > /tmp/aura1116.patch.gz
          echo '973489e06935e078357391c290b3c65234ab1a8a0510745aa23fd705030b4f50  /tmp/aura1116.patch.gz' | sha256sum -c -
          gzip -dc /tmp/aura1116.patch.gz > /tmp/aura1116.patch
          echo '76a4200792690cd1ea843145352af9e980873afecfc8a33829447cd1d2ab26d3  /tmp/aura1116.patch' | sha256sum -c -
          (cd aura11-project && patch --batch -p1 < /tmp/aura1116.patch)
          test -s aura11-project/app/src/main/java/br/com/edgard/aura/core/PcmGlitchGuard.java
          grep -Fq "11.1.6-pcm-stability-beta" aura11-project/app/build.gradle
          base64 -d aura11-117/patch.zip.base64 > /tmp/aura1117.zip
          echo 'a74f1bbf015935a6a0749820e166488530d05a856e4aac3f80fe8d7b269f63ea  /tmp/aura1117.zip' | sha256sum -c -
          unzip -q -o /tmp/aura1117.zip -d aura11-project
          grep -Fq '11.1.7-sync-dsp-beta' aura11-project/app/build.gradle
          base64 -d aura11-118/overlay.zip.base64 > /tmp/aura1118.zip
          echo '0ac94d15cf3c455d0c9eafc8ecb983fde81d69551cd2a442b451ec5ca0b8e51e  /tmp/aura1118.zip' | sha256sum -c -
          unzip -q -o /tmp/aura1118.zip -d aura11-project
          grep -Fq '11.1.8-pcm-recovery-beta' aura11-project/app/build.gradle
          grep -Fq 'producerFinished && availableFrames()>=2' aura11-project/app/src/main/java/br/com/edgard/aura/core/BufferedPcmDeck.java
          test -s aura11-project/app/src/main/java/br/com/edgard/aura/core/WsolaStereoStretch.java
          test -s aura11-project/app/src/main/java/br/com/edgard/aura/core/PhraseAnalyzer.java
          test -s aura11-project/app/src/debug/java/br/com/edgard/aura/DebugSmokeActivity.java
          base64 -d aura11-119/patch.gz.base64 > /tmp/aura1119.patch.gz
          echo 'ad820e309f3073f4eb430e8272f0168e084dbbd3d35703b1cc8c0480a0f75623  /tmp/aura1119.patch.gz' | sha256sum -c -
          gzip -dc /tmp/aura1119.patch.gz > /tmp/aura1119.patch
          echo 'c606c803f7346bc6bc6a2ac12fc36ce2fba072cd769ba10fa675112f0eba7b9a  /tmp/aura1119.patch' | sha256sum -c -
          (cd aura11-project && patch --batch -p1 < /tmp/aura1119.patch)
          grep -Fq '11.1.9-master-headroom-beta' aura11-project/app/build.gradle
          test -s aura11-project/app/src/main/java/br/com/edgard/aura/core/LookaheadMasterLimiter.java
          test -s aura11-project/tests/MasterOutputRegressionTest.java
          base64 -d aura11-120/patch.gz.base64 > /tmp/aura1120.patch.gz
          echo '95e4ab6f190874879793c61ed5b057543a5c250f325a8d363963954ae99b51ac  /tmp/aura1120.patch.gz' | sha256sum -c -
          gzip -dc /tmp/aura1120.patch.gz > /tmp/aura1120.patch
          (cd aura11-project && patch --batch -p1 < /tmp/aura1120.patch)
          grep -Fq '11.2.0-sync-clock-beta' aura11-project/app/build.gradle
          test -s aura11-project/tests/WsolaSourceTimelineRegressionTest.java
          base64 -d aura11-121/recovery.patch.gz.base64 > /tmp/aura1121.patch.gz
          echo '0d5984288f40fe7a0f1f3f7bb34599dee6ebfd6e5c7c86452218f4e827c7ae6f  /tmp/aura1121.patch.gz' | sha256sum -c -
          gzip -dc /tmp/aura1121.patch.gz > /tmp/aura1121.patch
          (cd aura11-project && patch --batch -p1 < /tmp/aura1121.patch)
          grep -Fq '11.2.1-recovery-focus-beta' aura11-project/app/build.gradle
          test -s aura11-project/app/src/main/java/br/com/edgard/aura/core/PcmHandoffWatchdog.java
          test -s aura11-project/tests/PcmHandoffWatchdogTest.java
          python3 aura11-121/postfix.py aura11-project
          base64 -d aura11-122/overlay.zip.base64 > /tmp/aura1122.zip
          echo '305f11bc6992d3ce779b9817c0020741ed7538941681d7a376d5b743af011cea  /tmp/aura1122.zip' | sha256sum -c -
          unzip -q -o /tmp/aura1122.zip -d aura11-project
          grep -Fq '11.2.2-auto-recovery-beta' aura11-project/app/build.gradle
          test -s aura11-project/app/src/main/java/br/com/edgard/aura/PcmIncidentCapture.java
          test -s aura11-project/app/src/main/java/br/com/edgard/aura/core/MixAutoRecovery.java
          base64 -d aura11-123/core.patch.gz.base64 > /tmp/aura1123.patch.gz
          echo '9620e52514a964b7a9e53dfd0633b0044140d6f87a765ed2ea8fbc8538fa0ab6  /tmp/aura1123.patch.gz' | sha256sum -c -
          gzip -dc /tmp/aura1123.patch.gz > /tmp/aura1123.patch
          (cd aura11-project && patch --batch -p1 < /tmp/aura1123.patch)
          grep -Fq '11.2.4-async-handoff-beta' aura11-project/app/build.gradle
          test -s aura11-project/app/src/main/java/br/com/edgard/aura/core/PrivateAudioExport.java
          base64 -d aura11-124/patch.gz.base64 > /tmp/aura1124.patch.gz
          echo 'da251f58d7298c8d7550c25a4b988f5c704c1178c05f05f0bbe01768e702acfc  /tmp/aura1124.patch.gz' | sha256sum -c -
          gzip -dc /tmp/aura1124.patch.gz > /tmp/aura1124.patch
          (cd aura11-project && patch --batch -p1 < /tmp/aura1124.patch)
          grep -Fq '11.2.4-async-handoff-beta' aura11-project/app/build.gradle
          test -s aura11-project/app/src/main/java/br/com/edgard/aura/core/AsyncDeckPreparer.java
      - name: Unit + integration model tests
        working-directory: aura11-project
        run: |
          set -euo pipefail
          bash tests/run-audit-tests.sh
          bash tests/run-pcm-buffer-tests.sh
          bash tests/run-pro-dsp-tests.sh
          bash tests/run-auto-recovery-tests.sh
          bash tests/run-security-reliability-tests.sh
          bash tests/run-audio-safety-tests.sh
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/AndroidManifest.xml').read_text()
          a=Path('app/src/main/java/br/com/edgard/aura/MainActivity.java').read_text()
          e=Path('app/src/main/java/br/com/edgard/aura/core/PrivateAudioExport.java').read_text()
          assert 'android.permission.INTERNET' not in m
          assert 'android:allowBackup="false"' in m
          assert m.count('android:exported="true"')==1
          assert 'settings.setBlockNetworkLoads(true)' in a
          assert 'settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW)' in a
          assert a.count('PrivateAudioExport.resolve(')>=4
          assert 'getCanonicalFile()' in e
          print('PASS AURA 11.2.3 security release gates')
          PY
          node --check app/src/main/assets/native-ui.js
      - name: Compile signed Android debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
        working-directory: aura11-project
      - name: Verify signature, manifest and bundled UI
        run: |
          set -euo pipefail
          APK=aura11-project/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'br.com.edgard.aura.completo11'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F '11.2.4-async-handoff-beta'
          unzip -l "$APK" | grep -F 'assets/aura.html'
          unzip -l "$APK" | grep -F 'assets/aura-fast.html'
          unzip -l "$APK" | grep -F 'assets/native-ui.js'
          unzip -l "$APK" | grep -F 'classes.dex'
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -F 'android.permission.INTERNET'
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EDGARD-AURA11-2-4-SECURITY-APK
          path: aura11-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  android-smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EDGARD-AURA11-2-4-SECURITY-APK
          path: aura11-apk
      - name: Configure KVM access
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true
      - name: Boot Android emulator and exercise real MediaPlayer handoff
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            mkdir -p android-smoke
            adb install -r aura11-apk/app-debug.apk
            adb logcat -c
            adb shell am start -W -n br.com.edgard.aura.completo11/br.com.edgard.aura.DebugSmokeActivity
            sleep 19
            adb exec-out run-as br.com.edgard.aura.completo11 cat shared_prefs/aura.xml > android-smoke/aura-state.xml
            adb logcat -d -v time > android-smoke/logcat.txt
            cat android-smoke/aura-state.xml
            grep -Fq 'name="smokeCheck">fixtures-created' android-smoke/aura-state.xml
            grep -Eq '<int name="dj_index" value="[1-9][0-9]*"' android-smoke/aura-state.xml
            grep -Eq '<string name="dj_mode">(playing|mixing)</string>' android-smoke/aura-state.xml
            grep -Fq 'CROSSFADE: AURA smoke 1' android-smoke/logcat.txt
            ! grep -Fq 'BEATMATCH EXPERIMENTAL' android-smoke/logcat.txt
            echo 'PASS Android MediaPlayer: local WAV handoff with no false beatmatch'
            adb logcat -c
            adb shell am start -W -n br.com.edgard.aura.completo11/br.com.edgard.aura.MainActivity
            sleep 7
            adb logcat -d -v time > android-smoke/ui-logcat.txt
            grep -Fq 'AURA_LOCAL_JS_ASSET' android-smoke/ui-logcat.txt
            grep -Fq 'AURA_OFFLINE_UI_READY /index.html' android-smoke/ui-logcat.txt
            ! grep -Fq 'FATAL EXCEPTION' android-smoke/ui-logcat.txt
            echo 'PASS AURA offline local WebView with native assets'
            ! grep -q 'FATAL EXCEPTION' android-smoke/logcat.txt
      - name: Export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AURA11-2-1-ANDROID-SMOKE-EVIDENCE
          path: android-smoke/
          if-no-files-found: ignore

  pcm-smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EDGARD-AURA11-2-4-SECURITY-APK
          path: aura11-apk
      - name: Configure KVM access
        run: sudo chmod 666 /dev/kvm || true
      - name: Boot Android emulator and exercise AudioTrack PCM mixer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            mkdir -p pcm-smoke
            adb install -r aura11-apk/app-debug.apk
            adb logcat -c
            adb shell am start -W -n br.com.edgard.aura.completo11/br.com.edgard.aura.DebugPcmSmokeActivity
            sleep 24
            adb exec-out run-as br.com.edgard.aura.completo11 cat shared_prefs/aura.xml > pcm-smoke/aura-state.xml
            adb logcat -d -v time > pcm-smoke/logcat.txt
            cat pcm-smoke/aura-state.xml
            grep -Fq 'name="smokePCM">fixtures-created' pcm-smoke/aura-state.xml
            grep -Eq '<int name="dj_index" value="[2-9][0-9]*"' pcm-smoke/aura-state.xml
            grep -Eq '<long name="pcm_output_frames" value="[1-9][0-9]*"' pcm-smoke/aura-state.xml
            ! grep -q 'FATAL EXCEPTION' pcm-smoke/logcat.txt
            echo 'PASS Android PCM two-deck AudioTrack service: 3 synthetic local tracks'
      - name: Export PCM smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AURA11-2-1-PCM-EMULATOR-EVIDENCE
          path: pcm-smoke/
          if-no-files-found: ignore

  sync-smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EDGARD-AURA11-2-4-SECURITY-APK
          path: aura11-apk
      - name: Configure KVM access
        run: sudo chmod 666 /dev/kvm || true
      - name: Test Android WSOLA and phase controller with digital master telemetry
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            mkdir -p sync-smoke
            adb install -r aura11-apk/app-debug.apk
            adb logcat -c
            adb shell am start -W -n br.com.edgard.aura.completo11/br.com.edgard.aura.DebugSyncSmokeActivity
            sleep 74
            adb exec-out run-as br.com.edgard.aura.completo11 cat shared_prefs/aura.xml > sync-smoke/state.xml
            adb logcat -d -v time > sync-smoke/logcat.txt
            cat sync-smoke/state.xml
            grep -Fq 'name="smokeSync">fixtures-created' sync-smoke/state.xml
            grep -Eq '<int name="dj_index" value="[2-9][0-9]*"' sync-smoke/state.xml
            grep -Eq '<long name="pcm_output_frames" value="[1-9][0-9]*"' sync-smoke/state.xml
            grep -Eq 'name="pcm_pitch_preserving" value="true"' sync-smoke/state.xml
            grep -Fq 'name="pcm_master_peak_dbfs"' sync-smoke/state.xml
            grep -Fq 'name="pcm_phase_error_ms"' sync-smoke/state.xml
            ! grep -q 'FATAL EXCEPTION' sync-smoke/logcat.txt
            echo 'PASS Android WSOLA source mixing, PCM meters and 2 track transitions'
      - name: Export sync smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AURA11-2-1-ANDROID-SYNC-EVIDENCE
          path: sync-smoke/
          if-no-files-found: ignore

  auto-repair-smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EDGARD-AURA11-2-4-SECURITY-APK
          path: aura11-apk
      - name: Configure KVM access
        run: sudo chmod 666 /dev/kvm || true
      - name: Exercise recovery from corrupted NEXT and capture PCM locally
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            mkdir -p auto-repair-smoke
            adb install -r aura11-apk/app-debug.apk
            adb logcat -c
            adb shell am start -W -n br.com.edgard.aura.completo11/br.com.edgard.aura.DebugAutoRecoverySmokeActivity
            sleep 14
            adb exec-out run-as br.com.edgard.aura.completo11 cat shared_prefs/aura.xml > auto-repair-smoke/state.xml
            adb logcat -d -v time > auto-repair-smoke/logcat.txt
            adb shell run-as br.com.edgard.aura.completo11 ls files/pcm-incidents > auto-repair-smoke/captures.txt
            grep -Fq 'name="smokeAutorepair">fixtures-created' auto-repair-smoke/state.xml
            grep -Eq '<int name="dj_index" value="[1-9][0-9]*"' auto-repair-smoke/state.xml
            grep -E 'incident-.*[.]wav' auto-repair-smoke/captures.txt
            ! grep -q 'FATAL EXCEPTION' auto-repair-smoke/logcat.txt
            echo 'PASS Android: recovered from corrupt incoming PCM and saved local diagnostic WAV'
      - name: Export autorecovery smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AURA11-2-2-AUTORECOVERY-EVIDENCE
          path: auto-repair-smoke/
          if-no-files-found: ignore
