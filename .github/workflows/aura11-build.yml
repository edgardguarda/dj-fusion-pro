name: EDGARD AURA11 Android
on:
  push:
    branches: [aura11-android-reproducao-imediata]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack AURA11 source
        run: |
          mkdir -p aura11-project
          unzip -q aura11-source.zip -d aura11-project
          test -s aura11-project/app/src/main/assets/aura-fast.html
          test -s aura11-project/app/src/main/assets/aura.html
          test -s aura11-project/app/src/main/java/br/com/edgard/aura/QuickMixService.java
          test $(wc -c < aura11-project/app/src/main/assets/aura-fast.html) -lt 150000
          test $(wc -c < aura11-project/app/src/main/assets/aura.html) -gt 1800000
      - name: Test PCM and Android JavaScript UI
        working-directory: aura11-project
        run: |
          bash tests/run-core-tests.sh
          node --check app/src/main/assets/native-ui.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          orig=Path('app/src/main/assets/aura.html').read_text()
          fast=Path('app/src/main/assets/aura-fast.html').read_text()
          main=Path('app/src/main/java/br/com/edgard/aura/MainActivity.java').read_text()
          qs=Path('app/src/main/java/br/com/edgard/aura/QuickMixService.java').read_text()
          assert len(re.findall(r'<script\b',fast,re.I))==0
          assert 'QuickMixService.START' in main
          assert 'MediaPlayer' in qs and 'setOnPreparedListener' in qs
          assert 'getCurrentPosition()' in qs and 'startFade(' in qs
          assert 'aura-portable-seed' in orig
          print('PASS source URI audio and independent original UI')
          PY
      - name: Compile APK
        run: gradle --no-daemon assembleDebug
        working-directory: aura11-project
      - name: Verify signed APK and full original UI
        run: |
          set -eu
          APK=aura11-project/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F br.com.edgard.aura.completo11
          unzip -l "$APK" | grep -F assets/aura.html
          unzip -l "$APK" | grep -F assets/aura-fast.html
          unzip -l "$APK" | grep -F assets/native-ui.js
          unzip -l "$APK" | grep -F classes.dex
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EDGARD-AURA11-ANDROID
          path: aura11-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
