name: EDGARD AURA 11.1.1 Android — audited build
on:
  push:
    branches: [aura11-1-1-apk-auditado]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble audited sources from verified base and overlay
        run: |
          set -euo pipefail
          echo "10d02c598c63be65c8ef473adcefc0a434ba418f5cc50eb1251cd8ab25dbe28f  aura11-source.zip" | sha256sum -c -
          base64 -d aura11-111/overlay.zip.base64 > /tmp/aura11-overlay.zip
          echo "fa130f7b1d3e217f648828148fb88e7cac356bf643ce8010a53b73dbb00f04ef  /tmp/aura11-overlay.zip" | sha256sum -c -
          mkdir -p aura11-project
          unzip -q aura11-source.zip -d aura11-project
          unzip -q -o /tmp/aura11-overlay.zip -d aura11-project
          grep -Fq "11.1.1-audit-beta" aura11-project/app/build.gradle
          test -s aura11-project/app/src/main/java/br/com/edgard/aura/QuickAudioAnalysis.java
          test -s aura11-project/app/src/main/java/br/com/edgard/aura/core/QuickBeatGrid.java
      - name: Run core and simulated playback tests
        working-directory: aura11-project
        run: |
          bash tests/run-audit-tests.sh
          node --check app/src/main/assets/native-ui.js
      - name: Build signed debug APK
        working-directory: aura11-project
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK signature and packaged UI
        run: |
          set -euo pipefail
          APK=aura11-project/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "br.com.edgard.aura.completo11"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "11.1.1-audit-beta"
          unzip -l "$APK" | grep -F "assets/aura.html"
          unzip -l "$APK" | grep -F "assets/aura-fast.html"
          unzip -l "$APK" | grep -F "assets/native-ui.js"
          unzip -l "$APK" | grep -F "classes.dex"
          sha256sum "$APK"
      - name: Upload AURA 11.1.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: EDGARD-AURA11-1-1-APK-AUDITADO
          path: aura11-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
