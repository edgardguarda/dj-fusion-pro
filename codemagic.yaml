# O Codemagic lê este arquivo do repositório.
# Funciona de dois jeitos, sozinho:
#  1) o repositório tem o projeto inteiro (pastas app, gradle...): compila direto;
#  2) o repositório tem só este arquivo e o projeto.zip: abre o zip e compila.
workflows:
  android-debug:
    name: DJ Fusion Pro (debug)
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      java: 17
    scripts:
      - name: Aceitar licenças do Android SDK
        script: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compilar APK de depuração
        script: |
          set -u
          RAIZ="$(pwd)"
          if [ -f projeto.zip ]; then
            rm -rf fonte && mkdir fonte && unzip -q projeto.zip -d fonte
            cd fonte
            echo "Projeto aberto do projeto.zip"
          fi
          if [ ! -f gradlew ]; then
            echo "ERRO: não achei o gradlew. Conteúdo da pasta:"; ls -la; exit 1
          fi
          if ! bash gradlew assembleDebug --console=plain > build.log 2>&1; then
            echo "=============== RESUMO DOS ERROS ==============="
            grep -nE "^e: |^w: .*error|error:|What went wrong|Execution failed|Could not|not found|FAILED" -A4 build.log | head -120
            echo "=============== FIM DO RESUMO ==============="
            exit 1
          fi
          cd "$RAIZ"
          mkdir -p apk
          cp "$(find . -path '*outputs/apk/debug/*.apk' | head -1)" apk/DJFusionPro-debug.apk
    artifacts:
      - apk/*.apk

  # Teste de ponta a ponta: compila, liga um emulador Android com tela de celular deitado e usa o app
  # como uma pessoa (toques, arrastes, seletor de arquivos). Fotos da tela e relatório saem nos artefatos.
  android-e2e:
    name: DJ Fusion Pro (teste no emulador)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Aceitar licenças do Android SDK
        script: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compilar app e teste
        script: |
          RAIZ="$(pwd)"
          if [ -f projeto.zip ]; then rm -rf fonte && mkdir fonte && unzip -q projeto.zip -d fonte; cd fonte; fi
          if ! bash gradlew assembleDebug assembleDebugAndroidTest --console=plain > build.log 2>&1; then
            echo "=============== RESUMO DOS ERROS ==============="
            grep -nE "^e: |error:|What went wrong|Execution failed|Could not|FAILED" -A4 build.log | head -150
            exit 1
          fi
          mkdir -p "$RAIZ/apk"
          cp "$(find . -path '*outputs/apk/debug/*.apk' | head -1)" "$RAIZ/apk/DJFusionPro-debug.apk"
          cp "$(find . -path '*outputs/apk/androidTest/debug/*.apk' | head -1)" "$RAIZ/apk/teste.apk"
      - name: Ligar emulador
        script: |
          SDK="$ANDROID_HOME"
          IMG="system-images;android-34;google_apis;x86_64"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "$IMG" "emulator" "platform-tools" > /dev/null
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n poco -k "$IMG" -d pixel_6 --force
          CFG="$HOME/.android/avd/poco.avd/config.ini"
          sed -i '/^hw.lcd/d;/^hw.keyboard/d;/^disk.dataPartition/d' "$CFG"
          printf 'hw.lcd.width=1220\nhw.lcd.height=2712\nhw.lcd.density=440\nhw.keyboard=yes\ndisk.dataPartition.size=4G\n' >> "$CFG"
          ls -l /dev/kvm || echo "sem /dev/kvm"
          nohup "$SDK/emulator/emulator" -avd poco -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none > emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 150); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 4
          done
          adb shell getprop sys.boot_completed
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82 || true
          adb shell wm size
          tail -5 emulator.log
      - name: Usar o app no emulador
        script: |
          mkdir -p e2e
          adb install -r -g apk/DJFusionPro-debug.apk
          adb install -r -g apk/teste.apk
          adb shell rm -rf /data/local/tmp/e2e
          adb shell mkdir -p /data/local/tmp/e2e
          adb logcat -c
          adb shell am instrument -w -r -e class app.djfusion.E2ETest app.djfusion.pro.test/androidx.test.runner.AndroidJUnitRunner > e2e/instrument.txt 2>&1 || true
          adb pull /data/local/tmp/e2e e2e/telas || true
          adb logcat -d > e2e/logcat.txt
          grep " E2E" e2e/logcat.txt | sed 's/^.* E2E *: //' > e2e/relatorio.txt || true
          echo "=============== RELATÓRIO ==============="
          cat e2e/relatorio.txt
          echo "=============== INSTRUMENTAÇÃO ==============="
          grep -E "FAILURES|OK \(|Tests run|INSTRUMENTATION_|Error|Exception" e2e/instrument.txt | head -40
          grep -nE "FATAL|AndroidRuntime" e2e/logcat.txt | head -20 || true
          zip -qr e2e.zip e2e
    artifacts:
      - apk/DJFusionPro-debug.apk
      - e2e.zip
      - e2e/telas/**/*.png
      - e2e/relatorio.txt
